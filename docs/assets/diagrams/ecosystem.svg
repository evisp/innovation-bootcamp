<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 720 322" role="img" aria-labelledby="eco-title eco-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="eco-title">The bootcamp as a bridge between academia and industry</title>
  <desc id="eco-desc">Academia and industry stand on either side, connected by Innovation Bootcamp Albania. Companies send real challenges across, and universities send back fresh ideas and talent. Institutions and local partners support both sides from below.</desc>
  <defs>
    <style>
      text { font-family: "Space Grotesk", "Inter", "Segoe UI", system-ui, Arial, sans-serif; }
      .title { font-size: 21px; font-weight: 700; }
      .item { font-size: 15px; }
      .flow { font-size: 14px; font-weight: 700; fill: #0F1B3D; }
    </style>
    <marker id="eco-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0F1B3D"/>
    </marker>
  </defs>

  <!-- foundation -->
  <rect x="20" y="300" width="680" height="54" rx="16" fill="#F0EEFF" stroke="#6C5CE7" stroke-width="2"/>
  <text x="360" y="323" text-anchor="middle" font-size="16" font-weight="700" fill="#3F32B5">Institutions and local partners</text>
  <text x="360" y="343" text-anchor="middle" font-size="13" fill="#4B3CC9">EU programmes, embassies, chambers of commerce, the municipality</text>

  <!-- bridge -->
  <path d="M232 150 Q360 20 488 150" fill="none" stroke="#0F1B3D" stroke-width="6" stroke-linecap="round"/>
  <g stroke="#B9C2DD" stroke-width="2">
    <line x1="280" y1="108" x2="280" y2="150"/>
    <line x1="320" y1="91" x2="320" y2="150"/>
    <line x1="400" y1="91" x2="400" y2="150"/>
    <line x1="440" y1="108" x2="440" y2="150"/>
  </g>
  <line x1="232" y1="150" x2="488" y2="150" stroke="#0F1B3D" stroke-width="4" stroke-linecap="round"/>
  <rect x="246" y="64" width="228" height="42" rx="21" fill="#0F1B3D"/>
  <text x="360" y="91" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Innovation Bootcamp</text>

  <!-- flows under the bridge -->
  <text x="360" y="196" text-anchor="middle" class="flow">real challenges</text>
  <line x1="470" y1="208" x2="250" y2="208" stroke="#0F1B3D" stroke-width="2" marker-end="url(#eco-arrow)"/>
  <text x="360" y="248" text-anchor="middle" class="flow">fresh ideas and talent</text>
  <line x1="250" y1="260" x2="470" y2="260" stroke="#0F1B3D" stroke-width="2" marker-end="url(#eco-arrow)"/>

  <!-- academia -->
  <rect x="50" y="130" width="182" height="170" rx="18" fill="#E6FBF6" stroke="#14C4B0" stroke-width="2"/>
  <text x="141" y="174" text-anchor="middle" class="title" fill="#0B6F63">Academia</text>
  <text x="141" y="208" text-anchor="middle" class="item" fill="#0B7A6E">universities</text>
  <text x="141" y="232" text-anchor="middle" class="item" fill="#0B7A6E">students</text>
  <text x="141" y="256" text-anchor="middle" class="item" fill="#0B7A6E">mentors</text>

  <!-- industry -->
  <rect x="488" y="130" width="182" height="170" rx="18" fill="#EAF2FE" stroke="#2F80ED" stroke-width="2"/>
  <text x="579" y="174" text-anchor="middle" class="title" fill="#1B5CBF">Industry</text>
  <text x="579" y="208" text-anchor="middle" class="item" fill="#1F63C4">partner companies</text>
  <text x="579" y="232" text-anchor="middle" class="item" fill="#1F63C4">their challenges</text>
  <text x="579" y="256" text-anchor="middle" class="item" fill="#1F63C4">future employers</text>
</svg>
