<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="ps-title ps-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ps-title">The two layers of a pitch</title>
  <desc id="ps-desc">Content: problem, solution, unique selling point, impact and a clear ending, in that order. Delivery: short, clear and confident, keeping the audience interested from start to end.</desc>
  <defs>
    <style>
      text { font-family: "Space Grotesk", "Inter", "Segoe UI", system-ui, Arial, sans-serif; }
      .n { font-size: 13px; font-weight: 700; fill: #B9F5E9; }
      .t { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
      .q { font-size: 13px; fill: #3A4668; }
      .lbl { font-size: 13px; font-weight: 700; fill: #5B6685; }
    </style>
  </defs>
  <text x="20" y="44" class="lbl">Content: what you say</text>
  <polygon points="20,60 140,60 156,105 140,150 20,150" fill="#0E9384"/>
  <text x="88" y="98" text-anchor="middle" class="n">1</text>
  <text x="88" y="120" text-anchor="middle" class="t">Problem</text>
  <text x="84" y="178" text-anchor="middle" class="q">Why should</text>
  <text x="84" y="195" text-anchor="middle" class="q">anyone care?</text>
  <polygon points="156,60 276,60 292,105 276,150 156,150 172,105" fill="#1A86B8"/>
  <text x="232" y="98" text-anchor="middle" class="n">2</text>
  <text x="232" y="120" text-anchor="middle" class="t">Solution</text>
  <text x="228" y="178" text-anchor="middle" class="q">What did you</text>
  <text x="228" y="195" text-anchor="middle" class="q">come up with?</text>
  <polygon points="292,60 412,60 428,105 412,150 292,150 308,105" fill="#2F6FD6"/>
  <text x="368" y="98" text-anchor="middle" class="n">3</text>
  <text x="368" y="120" text-anchor="middle" class="t">USP</text>
  <text x="364" y="178" text-anchor="middle" class="q">Why yours and</text>
  <text x="364" y="195" text-anchor="middle" class="q">not another?</text>
  <polygon points="428,60 548,60 564,105 548,150 428,150 444,105" fill="#4A5ED8"/>
  <text x="504" y="98" text-anchor="middle" class="n">4</text>
  <text x="504" y="120" text-anchor="middle" class="t">Impact</text>
  <text x="500" y="178" text-anchor="middle" class="q">Who does it help,</text>
  <text x="500" y="195" text-anchor="middle" class="q">and how much?</text>
  <polygon points="564,60 684,60 700,105 684,150 564,150 580,105" fill="#5B4BD6"/>
  <text x="640" y="98" text-anchor="middle" class="n">5</text>
  <text x="640" y="120" text-anchor="middle" class="t">Ending</text>
  <text x="636" y="178" text-anchor="middle" class="q">What should</text>
  <text x="636" y="195" text-anchor="middle" class="q">they remember?</text>
  <text x="20" y="228" class="lbl">Delivery: how you say it</text>
  <rect x="20" y="238" width="680" height="46" rx="14" fill="#0F1B3D"/>
  <text x="40" y="267" font-size="14"><tspan font-weight="700" fill="#B9F5E9">Short, clear and confident,</tspan><tspan fill="#FFFFFF"> keeping the room's interest from the first line to the last</tspan></text>
</svg>
