<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="dd-title dd-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="dd-title">Design Thinking as a double diamond</title>
  <desc id="dd-desc">In the problem space you first open up to understand the user, then narrow down by turning assumptions into insights. In the solution space you open up again to generate many possible solutions, then narrow down by testing before you build. What you learn sends you back to improve.</desc>
  <defs>
    <style>
      text { font-family: "Space Grotesk", "Inter", "Segoe UI", system-ui, Arial, sans-serif; }
      .space { font-size: 15px; font-weight: 700; }
      .lbl { font-size: 16px; font-weight: 700; }
      .sub { font-size: 13px; }
      .num { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    </style>
    <marker id="dd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8A93B2"/>
    </marker>
  </defs>

  <!-- spaces -->
  <text x="200" y="36" text-anchor="middle" class="space" fill="#0B6F63">Problem space</text>
  <text x="520" y="36" text-anchor="middle" class="space" fill="#3F32B5">Solution space</text>

  <!-- diamonds -->
  <path d="M40 190 L200 60 L360 190 L200 320 Z" fill="#E6FBF6" stroke="#14C4B0" stroke-width="2" stroke-linejoin="round"/>
  <path d="M360 190 L520 60 L680 190 L520 320 Z" fill="#F0EEFF" stroke="#6C5CE7" stroke-width="2" stroke-linejoin="round"/>
  <line x1="200" y1="72" x2="200" y2="308" stroke="#14C4B0" stroke-width="1.5" stroke-dasharray="3 6"/>
  <line x1="520" y1="72" x2="520" y2="308" stroke="#6C5CE7" stroke-width="1.5" stroke-dasharray="3 6"/>

  <!-- stage 1 -->
  <circle cx="132" cy="150" r="12" fill="#14C4B0"/>
  <text x="132" y="155" text-anchor="middle" class="num">1</text>
  <text x="132" y="186" text-anchor="middle" class="lbl" fill="#0B6F63">Understand</text>
  <text x="132" y="206" text-anchor="middle" class="sub" fill="#0B7A6E">the user</text>

  <!-- stage 2 -->
  <circle cx="270" cy="150" r="12" fill="#14C4B0"/>
  <text x="270" y="155" text-anchor="middle" class="num">2</text>
  <text x="270" y="186" text-anchor="middle" class="lbl" fill="#0B6F63">Assumptions</text>
  <text x="270" y="206" text-anchor="middle" class="sub" fill="#0B7A6E">into insights</text>

  <!-- stage 3 -->
  <circle cx="452" cy="150" r="12" fill="#6C5CE7"/>
  <text x="452" y="155" text-anchor="middle" class="num">3</text>
  <text x="452" y="186" text-anchor="middle" class="lbl" fill="#3F32B5">Many ideas</text>
  <text x="452" y="206" text-anchor="middle" class="sub" fill="#4B3CC9">for one problem</text>

  <!-- stage 4 -->
  <circle cx="590" cy="150" r="12" fill="#6C5CE7"/>
  <text x="590" y="155" text-anchor="middle" class="num">4</text>
  <text x="590" y="186" text-anchor="middle" class="lbl" fill="#3F32B5">Test early</text>
  <text x="590" y="206" text-anchor="middle" class="sub" fill="#4B3CC9">before you build</text>

  <!-- the point in the middle -->
  <line x1="360" y1="196" x2="360" y2="262" stroke="#0F1B3D" stroke-width="2"/>
  <circle cx="360" cy="190" r="9" fill="#0F1B3D"/>
  <rect x="302" y="262" width="116" height="30" rx="15" fill="#0F1B3D"/>
  <text x="360" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">clear problem</text>

  <!-- iterate -->
  <path d="M612 262 C 596 382, 476 382, 456 270" fill="none" stroke="#8A93B2" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#dd-arrow)"/>
  <text x="534" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#5B6685">learn, then go back and improve</text>
</svg>
