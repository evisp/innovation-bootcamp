<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="ts-title ts-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ts-title">The four stages of a team</title>
  <desc id="ts-desc">Team performance over time. Forming is polite and cautious. Performance dips during storming, when ideas and people clash. It rises again during norming as the team agrees how to work, and reaches its highest point in performing.</desc>
  <defs>
    <style>
      text { font-family: "Space Grotesk", "Inter", "Segoe UI", system-ui, Arial, sans-serif; }
      .t { font-size: 17px; font-weight: 700; }
      .s { font-size: 13px; }
      .ax { font-size: 13px; font-weight: 600; fill: #5B6685; }
    </style>
    <linearGradient id="ts-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14C4B0"/>
      <stop offset="0.5" stop-color="#2F80ED"/>
      <stop offset="1" stop-color="#6C5CE7"/>
    </linearGradient>
  </defs>

  <!-- axes -->
  <line x1="50" y1="300" x2="690" y2="300" stroke="#CFD6EA" stroke-width="2"/>
  <line x1="50" y1="40" x2="50" y2="300" stroke="#CFD6EA" stroke-width="2"/>
  <text x="690" y="324" text-anchor="end" class="ax">time during the week</text>
  <text x="60" y="36" class="ax">how well the team performs</text>

  <!-- the dip -->
  <rect x="220" y="194" width="160" height="106" rx="12" fill="#FFF1EC"/>
  <text x="300" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#B8452A">the normal dip</text>

  <path d="M70 210 C86.7 207.7 131.7 189.7 170 196 C208.3 202.3 255.0 255.3 300 248 C345.0 240.7 390.0 179.3 440 152 C490.0 124.7 560.0 97.0 600 84 C640.0 71.0 666.7 75.7 680 74" fill="none" stroke="url(#ts-line)" stroke-width="5" stroke-linecap="round"/>

  <!-- stages -->
  <circle cx="170" cy="196" r="9" fill="#FFFFFF" stroke="#14C4B0" stroke-width="4"/>
  <text x="170" y="158" text-anchor="middle" class="t" fill="#0B6F63">Forming</text>
  <text x="170" y="176" text-anchor="middle" class="s" fill="#0B7A6E">polite, finding roles</text>

  <circle cx="300" cy="248" r="9" fill="#FFFFFF" stroke="#FF7A59" stroke-width="4"/>
  <text x="300" y="274" text-anchor="middle" class="t" fill="#B8452A">Storming</text>
  <text x="300" y="291" text-anchor="middle" class="s" fill="#B8452A">ideas and people clash</text>

  <circle cx="440" cy="152" r="9" fill="#FFFFFF" stroke="#2F80ED" stroke-width="4"/>
  <text x="456" y="184" class="t" fill="#1B5CBF">Norming</text>
  <text x="456" y="202" class="s" fill="#1F63C4">agreeing how to work</text>

  <circle cx="600" cy="84" r="9" fill="#FFFFFF" stroke="#6C5CE7" stroke-width="4"/>
  <text x="600" y="122" text-anchor="middle" class="t" fill="#3F32B5">Performing</text>
  <text x="600" y="140" text-anchor="middle" class="s" fill="#4B3CC9">strong, focused work</text>
</svg>
