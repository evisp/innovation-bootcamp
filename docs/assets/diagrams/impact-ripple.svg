<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="ir-title ir-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ir-title">The impact ripple</title>
  <desc id="ir-desc">Your project sits at the centre. Around it are the people you validated with, then new groups with a similar need, for example a computer game adapted for elderly people with dementia or children with concentration issues, and finally the wider impact on society.</desc>
  <defs>
    <style>
      text { font-family: "Space Grotesk", "Inter", "Segoe UI", system-ui, Arial, sans-serif; }
      .t { font-size: 17px; font-weight: 700; }
      .s { font-size: 13px; }
    </style>
  </defs>

  <!-- rings -->
  <circle cx="210" cy="200" r="185" fill="#F5F9FF" stroke="#2F80ED" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="210" cy="200" r="150" fill="#F0EEFF" stroke="#6C5CE7" stroke-width="2"/>
  <circle cx="210" cy="200" r="100" fill="#E6FBF6" stroke="#14C4B0" stroke-width="2"/>
  <circle cx="210" cy="200" r="52" fill="#0F1B3D"/>
  <text x="210" y="197" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Your</text>
  <text x="210" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">project</text>

  <!-- leaders -->
  <g stroke="#8A93B2" stroke-width="1.5">
    <line x1="335" y1="64" x2="398" y2="64"/>
    <line x1="353" y1="154" x2="398" y2="154"/>
    <line x1="281" y1="270" x2="398" y2="270"/>
  </g>
  <circle cx="335" cy="64" r="4" fill="#2F80ED"/>
  <circle cx="353" cy="154" r="4" fill="#6C5CE7"/>
  <circle cx="281" cy="270" r="4" fill="#14C4B0"/>

  <!-- labels -->
  <text x="410" y="70" class="t" fill="#1B5CBF">Society</text>
  <text x="410" y="90" class="s" fill="#1F63C4">the wider change your work contributes to</text>

  <text x="410" y="160" class="t" fill="#3F32B5">New groups with a similar need</text>
  <text x="410" y="180" class="s" fill="#4B3CC9">e.g. a computer game adapted for elderly</text>
  <text x="410" y="197" class="s" fill="#4B3CC9">people with dementia, or for children</text>
  <text x="410" y="214" class="s" fill="#4B3CC9">with concentration issues</text>

  <text x="410" y="276" class="t" fill="#0B6F63">The people you validated with</text>
  <text x="410" y="296" class="s" fill="#0B7A6E">your first users and testers</text>
</svg>
