<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="hiw-title hiw-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="hiw-title">How Innovation Bootcamp Albania works</title>
  <desc id="hiw-desc">Companies bring a real challenge. Student teams explore, build and pitch. Mentors coach the teams every day. Companies and teams meet on Monday and the week ends with a final pitch on Friday.</desc>
  <defs>
    <style>
      text { font-family: "Space Grotesk", "Inter", "Segoe UI", system-ui, Arial, sans-serif; }
      .side { font-size: 15px; fill: #5B6685; }
      .side-strong { font-size: 15px; font-weight: 700; fill: #0F1B3D; }
      .node { font-size: 20px; font-weight: 700; }
      .node-sub { font-size: 15px; }
    </style>
    <radialGradient id="hiw-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B9F5E9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#B9F5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hiw-hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22336A"/>
      <stop offset="1" stop-color="#0F1B3D"/>
    </linearGradient>
  </defs>

  <!-- connections -->
  <path d="M360 62 L155 386 L565 386 Z" fill="none" stroke="#C3CCE8" stroke-width="2.5" stroke-dasharray="7 9" stroke-linejoin="round"/>

  <!-- the challenge -->
  <circle cx="360" cy="262" r="128" fill="url(#hiw-glow)"/>
  <circle cx="360" cy="262" r="90" fill="none" stroke="#14C4B0" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
  <circle cx="360" cy="262" r="76" fill="url(#hiw-hub)"/>
  <text x="360" y="251" text-anchor="middle" font-size="16" font-weight="500" fill="#B9F5E9">one real</text>
  <text x="360" y="281" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">challenge</text>

  <!-- side labels -->
  <text x="232" y="212" text-anchor="end" class="side-strong">Speed-dating</text>
  <text x="232" y="232" text-anchor="end" class="side">on Monday</text>
  <text x="488" y="212" class="side-strong">Final pitch</text>
  <text x="488" y="232" class="side">on Friday</text>
  <text x="360" y="458" text-anchor="middle" class="side-strong">Coaching every day</text>

  <!-- companies -->
  <rect x="236" y="26" width="248" height="72" rx="36" fill="#E6FBF6" stroke="#14C4B0" stroke-width="2"/>
  <circle cx="273" cy="62" r="22" fill="#14C4B0"/>
  <path d="M265 73V52h10v7h7v14z" fill="#FFFFFF"/>
  <text x="305" y="58" class="node" fill="#0B6F63">Companies</text>
  <text x="305" y="81" class="node-sub" fill="#0B7A6E">bring the challenge</text>

  <!-- students -->
  <rect x="22" y="350" width="266" height="72" rx="36" fill="#F0EEFF" stroke="#6C5CE7" stroke-width="2"/>
  <circle cx="59" cy="386" r="22" fill="#6C5CE7"/>
  <circle cx="59" cy="379" r="5" fill="#FFFFFF"/>
  <path d="M49 396c1.2-6 5.4-9 10-9s8.8 3 10 9z" fill="#FFFFFF"/>
  <text x="91" y="382" class="node" fill="#3F32B5">Student teams</text>
  <text x="91" y="405" class="node-sub" fill="#4B3CC9">explore, build, pitch</text>

  <!-- mentors -->
  <rect x="432" y="350" width="266" height="72" rx="36" fill="#EAF2FE" stroke="#2F80ED" stroke-width="2"/>
  <circle cx="469" cy="386" r="22" fill="#2F80ED"/>
  <path d="M459 377h20a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-10l-5 4.5v-4.5h-5a3 3 0 0 1-3-3v-10a3 3 0 0 1 3-3z" fill="#FFFFFF"/>
  <text x="501" y="382" class="node" fill="#1B5CBF">Mentors</text>
  <text x="501" y="405" class="node-sub" fill="#1F63C4">coach the teams</text>
</svg>
