<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="cps-title cps-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="cps-title">The customer, problem and solution triangle</title>
  <desc id="cps-desc">Start from the problem. The problem tells you who the customer is, the customer's needs shape the solution, and the solution is checked against the original problem. Validate at every step.</desc>
  <defs>
    <style>
      text { font-family: "Space Grotesk", "Inter", "Segoe UI", system-ui, Arial, sans-serif; }
      .t { font-size: 20px; font-weight: 700; }
      .s { font-size: 14px; }
      .edge { font-size: 14px; font-weight: 700; fill: #0F1B3D; }
      .num { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
    </style>
    <marker id="cps-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0F1B3D"/>
    </marker>
    <marker id="cps-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8A93B2"/>
    </marker>
  </defs>

  <!-- centre -->
  <circle cx="360" cy="240" r="62" fill="#E6FBF6"/>
  <circle cx="360" cy="240" r="62" fill="none" stroke="#14C4B0" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="360" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#0B6F63">validate</text>
  <text x="360" y="256" text-anchor="middle" font-size="13" fill="#0B7A6E">at every step</text>

  <!-- edges -->
  <line x1="300" y1="106" x2="190" y2="310" stroke="#0F1B3D" stroke-width="2.5" marker-end="url(#cps-arrow)"/>
  <text x="215" y="190" text-anchor="end" class="edge">For whom is</text>
  <text x="215" y="208" text-anchor="end" class="edge">it a problem?</text>

  <line x1="280" y1="356" x2="438" y2="356" stroke="#0F1B3D" stroke-width="2.5" marker-end="url(#cps-arrow)"/>
  <text x="359" y="340" text-anchor="middle" class="edge">needs shape it</text>

  <line x1="530" y1="310" x2="420" y2="106" stroke="#8A93B2" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#cps-arrow-muted)"/>
  <text x="505" y="190" class="edge">Does it really</text>
  <text x="505" y="208" class="edge">remove the pain?</text>

  <!-- problem -->
  <rect x="235" y="30" width="250" height="72" rx="36" fill="#E6FBF6" stroke="#14C4B0" stroke-width="2"/>
  <circle cx="272" cy="66" r="21" fill="#14C4B0"/>
  <text x="272" y="72" text-anchor="middle" class="num">1</text>
  <text x="304" y="62" class="t" fill="#0B6F63">The problem</text>
  <text x="304" y="84" class="s" fill="#0B7A6E">a real need or pain</text>

  <!-- customer -->
  <rect x="40" y="320" width="240" height="72" rx="36" fill="#F0EEFF" stroke="#6C5CE7" stroke-width="2"/>
  <circle cx="77" cy="356" r="21" fill="#6C5CE7"/>
  <text x="77" y="362" text-anchor="middle" class="num">2</text>
  <text x="109" y="352" class="t" fill="#3F32B5">The customer</text>
  <text x="109" y="374" class="s" fill="#4B3CC9">who feels it most</text>

  <!-- solution -->
  <rect x="440" y="320" width="240" height="72" rx="36" fill="#EAF2FE" stroke="#2F80ED" stroke-width="2"/>
  <circle cx="477" cy="356" r="21" fill="#2F80ED"/>
  <text x="477" y="362" text-anchor="middle" class="num">3</text>
  <text x="509" y="352" class="t" fill="#1B5CBF">The solution</text>
  <text x="509" y="374" class="s" fill="#1F63C4">removes the pain</text>
</svg>
